<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">YOLOv3: Darknet-53 và ba nhánh dự đoán</title>
  <desc id="desc">Ảnh 416 qua Darknet-53. Đặc trưng stride 32 tạo đầu ra 13; upsample và ghép đặc trưng stride 16 tạo đầu ra 26; lặp lại với stride 8 tạo đầu ra 52.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677b"/></marker></defs>
  <rect width="960" height="540" rx="16" fill="#f4f7fb"/>
  <g font-family="Arial, sans-serif" fill="#142d43" text-anchor="middle">
    <text x="480" y="42" font-size="26" font-weight="bold">YOLOv3 · 416 × 416</text>
    <g fill="#e0ebf5" stroke="#52677b" stroke-width="2">
      <rect x="28" y="225" width="130" height="80" rx="10"/>
      <rect x="195" y="180" width="170" height="170" rx="10"/>
      <rect x="435" y="85" width="225" height="80" rx="10"/>
      <rect x="435" y="225" width="225" height="80" rx="10"/>
      <rect x="435" y="365" width="225" height="80" rx="10"/>
    </g>
    <g fill="#dcefe7" stroke="#297254" stroke-width="2">
      <rect x="740" y="85" width="190" height="80" rx="10"/>
      <rect x="740" y="225" width="190" height="80" rx="10"/>
      <rect x="740" y="365" width="190" height="80" rx="10"/>
    </g>
    <g font-size="20">
      <text x="93" y="259">Ảnh RGB</text><text x="93" y="286" font-size="17">416 × 416 × 3</text>
      <text x="280" y="260" font-weight="bold">Darknet-53</text><text x="280" y="290" font-size="16">Backbone</text>
      <text x="548" y="118">Conv · 13 × 13</text><text x="548" y="146" font-size="16">Stride 32</text>
      <text x="548" y="258">Ghép + Conv</text><text x="548" y="286" font-size="16">26 × 26 · Stride 16</text>
      <text x="548" y="398">Ghép + Conv</text><text x="548" y="426" font-size="16">52 × 52 · Stride 8</text>
      <text x="835" y="119">13 × 13 × 255</text><text x="835" y="147" font-size="16">3 anchor / ô</text>
      <text x="835" y="259">26 × 26 × 255</text><text x="835" y="287" font-size="16">3 anchor / ô</text>
      <text x="835" y="399">52 × 52 × 255</text><text x="835" y="427" font-size="16">3 anchor / ô</text>
    </g>
    <g stroke="#52677b" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M158 265H195"/><path d="M365 215H395V125H435"/>
      <path d="M365 265H435"/><path d="M365 315H395V405H435"/>
      <path d="M660 125H740"/><path d="M660 265H740"/><path d="M660 405H740"/>
      <path d="M548 165V225"/><path d="M548 305V365"/>
    </g>
    <g font-size="15"><text x="648" y="198">Upsample ×2</text><text x="648" y="338">Upsample ×2</text></g>
    <text x="480" y="496" font-size="17">80 lớp → 3 × (4 tọa độ + 1 objectness + 80 điểm lớp) = 255 kênh</text>
  </g>
</svg>
